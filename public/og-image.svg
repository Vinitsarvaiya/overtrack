<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OverTrack Open Graph Image</title>
  <desc id="desc">A branded preview card for OverTrack showing overtime analytics, team controls, and monthly reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1018" />
      <stop offset="100%" stop-color="#181b28" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1060" cy="110" r="140" fill="#8b5cf6" fill-opacity=".14" />
  <circle cx="120" cy="520" r="170" fill="#7c3aed" fill-opacity=".08" />
  <g transform="translate(90 90)">
    <rect width="108" height="108" rx="24" fill="url(#panel)" />
    <circle cx="54" cy="54" r="24" fill="none" stroke="#ecfeff" stroke-width="6" />
    <path d="M54 39v16l11 8" fill="none" stroke="#ecfeff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" />
    <path d="M18 78l14-11 10 6 20-21 16 6" fill="none" stroke="#c4b5fd" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" />
  </g>
  <text x="230" y="148" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">
    OverTrack
  </text>
  <text x="90" y="265" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700">
    Overtime tracking built for teams
  </text>
  <text x="90" y="325" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="28">
    Review timesheets, manage approvals, and export monthly reports from one clean workspace.
  </text>
  <g transform="translate(90 390)">
    <rect width="320" height="150" rx="24" fill="#151825" stroke="#2c3146" />
    <text x="28" y="42" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="22">This Month</text>
    <text x="28" y="98" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">182.5 hrs</text>
    <text x="28" y="128" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="22">+14% from last month</text>
  </g>
  <g transform="translate(440 390)">
    <rect width="280" height="150" rx="24" fill="#151825" stroke="#2c3146" />
    <text x="28" y="42" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="22">Approvals</text>
    <text x="28" y="98" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">28</text>
    <text x="28" y="128" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">Pending manager review</text>
  </g>
  <g transform="translate(750 390)">
    <rect width="360" height="150" rx="24" fill="#151825" stroke="#2c3146" />
    <text x="28" y="42" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="22">Reports</text>
    <text x="28" y="88" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">CSV, PDF, team exports</text>
    <text x="28" y="126" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">For payroll, finance, and audits</text>
  </g>
</svg>
